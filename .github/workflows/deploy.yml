name: Deploy portfolio to S3

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # cada lunes: rebuild para refrescar los README de GitHub
  workflow_dispatch:

permissions:
  id-token: write   # OIDC: sin access keys guardadas en GitHub
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: ./deploy.sh "${{ vars.S3_BUCKET }}" "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
